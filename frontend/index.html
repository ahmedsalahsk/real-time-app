<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Chat</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
  margin: 0;
  min-height: 100vh;
  background: #111B21;
  color: #E9EDEF;
  font-family:
    "Segoe UI",
    Inter,
    Roboto,
    sans-serif;
}

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(17, 24, 39, 0.18), rgba(17, 24, 39, 0.18)),
          url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80")
            center/cover;
      }

      .auth-panel {
        width: min(420px, 100%);
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 20px 70px rgba(17, 24, 39, 0.22);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: 800;
        font-size: 22px;
      }

      .mark {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        display: grid;
        place-items: center;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 4px;
        border-radius: 8px;
        background: #e5e7eb;
        margin-bottom: 18px;
      }

      .tab {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #374151;
        padding: 10px 12px;
        font-weight: 700;
      }

      .tab.active {
        background: #fff;
        color: #111827;
        box-shadow: 0 1px 4px rgba(17, 24, 39, 0.12);
      }

      .form {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 13px;
        color: #4b5563;
        font-weight: 700;
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #111827;
        padding: 12px;
        outline: none;
      }

      .field input:focus,
      .field textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .primary,
      .secondary,
      .ghost,
      .danger {
        border: 0;
        border-radius: 8px;
        padding: 11px 14px;
        font-weight: 800;
        min-height: 42px;
      }

      .primary{
    background:#00A884;
    color:#fff;
}
.primary:hover{
    background:#06B48F;
}

      .secondary{
    background:#005C4B;
    color:#fff;
}

      .ghost {
         background:#2A3942;
    color:#E9EDEF;
      }

      .danger {
        background:#4A1F23;
    color:#FFB4B4;
      }

      .primary:disabled,
      .secondary:disabled,
      .ghost:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-columns: 330px 1fr;
        overflow: hidden;
      }

      .sidebar {
        background: #202C33;
  border-right: 1px solid #2A3942;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .side-head {
        padding: 18px;
         background:#202C33;
    border-bottom:1px solid #2A3942;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .user-meta {
        min-width: 0;
      }

      .user-meta strong,
      .item-main strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
            color:#F5F7F8;
      }

      .muted {
    color:#8696A0;
        font-size: 13px;
      }

      .connection {
        display: inline-flex;
        align-items: center;
        gap: 7px;
    color:#8696A0;
        font-size: 13px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ef4444;
        flex: 0 0 auto;
      }

      .dot.on {
        background: #16a34a;
      }

      .panel-tools {
        padding: 12px;
        display: grid;
        gap: 10px;
        background:#202C33;
    border-bottom:1px solid #2A3942;
      }

      .mode-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .mode-tabs button {
        background:#202C33;
    color:#8696A0;
    border:1px solid #2A3942;
        border-radius: 8px;
        padding: 10px;
        font-weight: 800;
      }

      .mode-tabs button.active {
            background:#005C4B;
    border-color:#00A884;
    color:#fff;
      }

      .search-row,
      .message-form,
      .room-form {
        display: flex;
        gap: 8px;
      }

      .search-row input,
      .message-form input,
      .room-form input {
        flex: 1;
        min-width: 0;
        background:#2A3942;
    border:1px solid #3B4A54;
    color:#E9EDEF;
        border-radius: 8px;
        padding: 11px;
        outline: none;
      }
      .search-row input::placeholder,
.message-form input::placeholder,
.room-form input::placeholder{
    color:#8696A0;
}

      .room-form {
        display: grid;
        grid-template-columns: 1fr auto;
      }

      .checkbox-line {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #374151;
        font-size: 13px;
        font-weight: 700;
      }

      .list {
        overflow: auto;
        padding: 8px;
        display: grid;
        gap: 6px;
      }

      .item {
        width: 100%;
        border: 1px solid transparent;
        background: #fff;
        border-radius: 8px;
        padding: 12px;
        text-align: left;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .item:hover {
        border-color: #d1d5db;
        background: #f9fafb;
      }

      .item.active {
        border-color: #2563eb;
        background: #eff6ff;
      }

      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 8px;
          background:#00A884;
    color:white;
        display: grid;
        place-items: center;
        font-weight: 900;
        flex: 0 0 auto;
      }

      .avatar.teal {
        background: #0f766e;
      }

      .item-main {
        min-width: 0;
        flex: 1;
      }

      .chat {
  min-width: 0;
  height: 100vh;
  display: grid;
  grid-template-rows: 74px minmax(0,1fr) auto;
  overflow: hidden;
    background:#0B141A;
}

      .chat-head {
        min-height: 74px;
        padding: 16px 20px;
        background:#202C33;
    border-bottom:1px solid #2A3942;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .messages {
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
  padding: 18px 20px;
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
}

      .bubble {
        width: fit-content;
        max-width: min(680px, 82%);
        border-radius: 8px;
        padding: 10px 12px;
         background:#202C33;
    border:1px solid #2A3942;
    color:#E9EDEF;
        box-shadow: 0 1px 2px rgba(17, 24, 39, 0.05);
      }

      .bubble.me {
        align-self: flex-end;
          background:#005C4B;
    border-color:#006D5B;
    color:#fff;
      }

      .bubble strong {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
    color:#F5F7F8;
      }

      .bubble p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .time {
        margin-top: 6px;
        display: block;
    color:#8696A0;
        font-size: 11px;
      }

      .composer {
  flex-shrink: 0;

  background:#202C33;
    border-top:1px solid #2A3942;

  padding: 14px;

  position: sticky;
  bottom: 0;

  z-index: 10;
}

      .empty {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        color: #6b7280;
        padding: 24px;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: grid;
        gap: 8px;
        z-index: 30;
      }

      .toast-item {
        background:#202C33;
    color:#fff;
        border-radius: 8px;
        padding: 12px 14px;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.25);
      }

      .typing {
        padding: 0 20px 8px;
        min-height: 20px;
            color:#8696A0;

        font-size: 13px;
      }

      .item{
    background:#202C33;
    color:#E9EDEF;
}

.item:hover{
    background:#2A3942;
    border-color:#2A3942;
}

.item.active{
    background:#2A3942;
    border-color:#00A884;
}

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: 42vh 58vh;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid #e5e7eb;
        }

        .side-head {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script>
      const h = React.createElement;
      const API_URL = localStorage.getItem("apiUrl") || "http://localhost:3000";

      function App() {
        const [authMode, setAuthMode] = React.useState("login");
        const [token, setToken] = React.useState(
          localStorage.getItem("token") || "",
        );
        const [user, setUser] = React.useState(
          JSON.parse(localStorage.getItem("user") || "null"),
        );
        const [socket, setSocket] = React.useState(null);
        const [connected, setConnected] = React.useState(false);
        const [toasts, setToasts] = React.useState([]);
        const [mode, setMode] = React.useState("rooms");
        const [rooms, setRooms] = React.useState([]);
        const [conversations, setConversations] = React.useState([]);
        const [users, setUsers] = React.useState([]);
        const [onlineUsers, setOnlineUsers] = React.useState(new Set());
        const [active, setActive] = React.useState(null);
        const [messages, setMessages] = React.useState([]);
        const [loadingMessages, setLoadingMessages] = React.useState(false);
        const [typing, setTyping] = React.useState("");
        const activeRef = React.useRef(null);
        const typingTimeoutRef = React.useRef(null);
        const isTypingRef = React.useRef(false);
        React.useEffect(() => {
          activeRef.current = active;
        }, [active]);

        const toast = React.useCallback((message) => {
          const id = Date.now() + Math.random();
          setToasts((items) => [...items, { id, message }]);
          setTimeout(
            () => setToasts((items) => items.filter((item) => item.id !== id)),
            3200,
          );
        }, []);

        const api = React.useCallback(
          async (path, options = {}) => {
            const response = await fetch(API_URL + path, {
              ...options,
              headers: {
                "Content-Type": "application/json",
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
                ...(options.headers || {}),
              },
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok)
              throw new Error(data.message || data.error || "Request failed");
            return data;
          },
          [token],
        );

        const loadRooms = React.useCallback(async () => {
          try {
            setRooms(await api("/api/rooms"));
          } catch (error) {
            toast(error.message);
          }
        }, [api, toast]);

        const loadConversations = React.useCallback(async () => {
          try {
            setConversations(await api("/api/dm/conversations"));
          } catch (error) {
            toast(error.message);
          }
        }, [api, toast]);

        const searchUsers = React.useCallback(
          async (search = "") => {
            try {
              setUsers(
                await api(
                  `/api/users?search=${encodeURIComponent(search)}&limit=30`,
                ),
              );
            } catch (error) {
              toast(error.message);
            }
          },
          [api, toast],
        );

        React.useEffect(() => {
          if (!token) return undefined;
          loadRooms();
          loadConversations();
          searchUsers("");
        }, [token, loadRooms, loadConversations, searchUsers]);

        React.useEffect(() => {
          if (!token || typeof io !== "function") return undefined;
          const client = io(API_URL, {
            auth: { token },
            query: { token },
            reconnectionAttempts: 10,
          });

          client.on("connect", () => setConnected(true));
          client.on("disconnect", () => setConnected(false));
          client.on("connect_error", (error) => toast(error.message));
          client.on("socket-error", (error) => toast(error.message));
          client.on("online-users", (items) =>
            setOnlineUsers(new Set(items.map((item) => item.userId))),
          );
          client.on("user-online", (item) =>
            setOnlineUsers((set) => new Set([...set, item.userId])),
          );
          client.on("user-offline", (item) =>
            setOnlineUsers((set) => {
              const copy = new Set(set);
              copy.delete(item.userId);
              return copy;
            }),
          );
          client.on("new-message", (message) => {
            const selected = activeRef.current;
            setMessages((items) =>
              selected?.type === "room" && selected.id === message.room
                ? [message, ...items]
                : items,
            );
          });
          client.on("dm:new-message", (message) => {
            const selected = activeRef.current;
            setMessages((items) =>
              selected?.type === "dm" && selected.id === message.conversation
                ? [message, ...items]
                : items,
            );
            loadConversations();
          });
          client.on("user-typing", (data) =>
            setTyping(`${data.username} is typing`),
          );
          client.on("user-typing-stopped", () => setTyping(""));
          client.on("dm:user-typing", (data) =>
            setTyping(`${data.username} is typing`),
          );
          client.on("dm:user-typing-stopped", () => setTyping(""));

          setSocket(client);
          return () => client.disconnect();
        }, [token, toast, loadConversations]);

        async function submitAuth(event) {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const payload = Object.fromEntries(form.entries());
          try {
            const data = await api(
              `/api/auth/${authMode === "login" ? "login" : "register"}`,
              {
                method: "POST",
                body: JSON.stringify(payload),
              },
            );
            if (authMode === "register") {
              setAuthMode("login");
              toast("Account created");
              return;
            }
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));
            setToken(data.token);
            setUser(data.user);
          } catch (error) {
            toast(error.message);
          }
        }

        async function createRoom(event) {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const name = form.get("name");
          if (!name.trim()) return;
          try {
            await api("/api/rooms", {
              method: "POST",
              body: JSON.stringify({
                name,
                description: "",
                isPrivate: form.get("isPrivate") === "on",
              }),
            });
            event.currentTarget.reset();
            await loadRooms();
          } catch (error) {
            toast(error.message);
          }
        }

        async function openRoom(room) {
          setMode("rooms");
          setActive({
            type: "room",
            id: room._id,
            title: room.name,
            subtitle: room.isPrivate ? "Private room" : "Public room",
          });
          setLoadingMessages(true);
          setTyping("");
          try {
            const data = await api(
              `/api/rooms/${room._id}/messages?limit=50&skip=0`,
            );
            setMessages(data);
            socket?.emit("join-room", { roomId: room._id });
          } catch (error) {
            toast(error.message);
          } finally {
            setLoadingMessages(false);
          }
        }

        async function openConversation(conversation) {
          const other =
            conversation.participants.find((item) => item._id !== user._id) ||
            conversation.participants[0];
          setMode("direct");
          setActive({
            type: "dm",
            id: conversation._id,
            title: other.displayName || other.username,
            subtitle: onlineUsers.has(other._id) ? "Online" : "Offline",
            receiverId: other._id,
          });
          setLoadingMessages(true);
          setTyping("");
          try {
            setMessages(
              await api(
                `/api/dm/conversations/${conversation._id}/messages?limit=50&skip=0`,
              ),
            );
          } catch (error) {
            toast(error.message);
          } finally {
            setLoadingMessages(false);
          }
        }

        async function startConversation(targetUser) {
          try {
            const conversation = await api(
              `/api/dm/conversations/with/${targetUser._id}`,
            );
            await loadConversations();
            await openConversation(conversation);
          } catch (error) {
            toast(error.message);
          }
        }

        function sendMessage(event) {
          event.preventDefault();
          const input = event.currentTarget.elements.message;
          const text = input.value.trim();
          if (!text || !active || !socket) return;
          const clientMessageId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;

          if (active.type === "room") {
            socket.emit("send-message", {
              roomId: active.id,
              text,
              clientMessageId,
            });
          } else {
            socket.emit("dm:send", {
              receiverId: active.receiverId,
              text,
              clientMessageId,
            });
          }
          clearTimeout(typingTimeoutRef.current);
          isTypingRef.current = false;

          if (active.type === "room") {
            socket.emit("typing-stop", {
              roomId: active.id,
            });
          } else {
            socket.emit("dm:typing-stop", {
              receiverId: active.receiverId,
              conversationId: active.id,
            });
          }

          input.value = "";
        }

        function handleTyping() {
          if (!active || !socket) return;

          if (!isTypingRef.current) {
            isTypingRef.current = true;

            if (active.type === "room") {
              socket.emit("typing-start", {
                roomId: active.id,
              });
            } else {
              socket.emit("dm:typing-start", {
                receiverId: active.receiverId,
                conversationId: active.id,
              });
            }
          }

          clearTimeout(typingTimeoutRef.current);

          typingTimeoutRef.current = setTimeout(() => {
            isTypingRef.current = false;

            if (active.type === "room") {
              socket.emit("typing-stop", {
                roomId: active.id,
              });
            } else {
              socket.emit("dm:typing-stop", {
                receiverId: active.receiverId,
                conversationId: active.id,
              });
            }
          }, 5000);
        }
        function logout() {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          setToken("");
          setUser(null);
          setActive(null);
          socket?.disconnect();
        }

        if (!token || !user) {
          return h(
            "div",
            { className: "auth-shell" },
            h(
              "div",
              { className: "auth-panel" },
              h(
                "div",
                { className: "brand" },
                h("div", { className: "mark" }, "C"),
                "Real-Time Chat",
              ),
              h(
                "div",
                { className: "tabs" },
                h(
                  "button",
                  {
                    className: `tab ${authMode === "login" ? "active" : ""}`,
                    onClick: () => setAuthMode("login"),
                  },
                  "Login",
                ),
                h(
                  "button",
                  {
                    className: `tab ${authMode === "register" ? "active" : ""}`,
                    onClick: () => setAuthMode("register"),
                  },
                  "Register",
                ),
              ),
              h(
                "form",
                { className: "form", onSubmit: submitAuth },
                authMode === "register" &&
                  h(
                    "div",
                    { className: "field" },
                    h("label", null, "Username"),
                    h("input", {
                      name: "username",
                      minLength: 3,
                      maxLength: 20,
                      required: true,
                    }),
                  ),
                authMode === "register" &&
                  h(
                    "div",
                    { className: "field" },
                    h("label", null, "Display name"),
                    h("input", {
                      name: "displayName",
                      minLength: 3,
                      maxLength: 30,
                      required: true,
                    }),
                  ),
                h(
                  "div",
                  { className: "field" },
                  h("label", null, "Email"),
                  h("input", { name: "email", type: "email", required: true }),
                ),
                h(
                  "div",
                  { className: "field" },
                  h("label", null, "Password"),
                  h("input", {
                    name: "password",
                    type: "password",
                    minLength: 6,
                    required: true,
                  }),
                ),
                h(
                  "button",
                  { className: "primary", type: "submit" },
                  authMode === "login" ? "Login" : "Create account",
                ),
              ),
              h(Toast, { toasts }),
            ),
          );
        }

        return h(
          React.Fragment,
          null,
          h(
            "main",
            { className: "app" },
            h(
              "aside",
              { className: "sidebar" },
              h(
                "div",
                { className: "side-head" },
                h(
                  "div",
                  { className: "user-meta" },
                  h("strong", null, user.displayName || user.username),
                  h(
                    "span",
                    { className: "connection" },
                    h("span", { className: `dot ${connected ? "on" : ""}` }),
                    connected ? "Connected" : "Disconnected",
                  ),
                ),
                h("button", { className: "danger", onClick: logout }, "Logout"),
              ),
              h(
                "div",
                { className: "panel-tools" },
                h(
                  "div",
                  { className: "mode-tabs" },
                  h(
                    "button",
                    {
                      className: mode === "rooms" ? "active" : "",
                      onClick: () => setMode("rooms"),
                    },
                    "Rooms",
                  ),
                  h(
                    "button",
                    {
                      className: mode === "direct" ? "active" : "",
                      onClick: () => setMode("direct"),
                    },
                    "Direct",
                  ),
                ),
                mode === "rooms" &&
                  h(
                    "form",
                    { className: "room-form", onSubmit: createRoom },
                    h("input", {
                      name: "name",
                      placeholder: "New room",
                      minLength: 3,
                      maxLength: 50,
                    }),
                    h("button", { className: "secondary" }, "Add"),
                    h(
                      "label",
                      { className: "checkbox-line" },
                      h("input", { type: "checkbox", name: "isPrivate" }),
                      "Private",
                    ),
                  ),
                mode === "direct" &&
                  h(
                    "div",
                    { className: "search-row" },
                    h("input", {
                      placeholder: "Search users",
                      onChange: (event) => searchUsers(event.target.value),
                    }),
                    h(
                      "button",
                      { className: "ghost", onClick: () => searchUsers("") },
                      "Clear",
                    ),
                  ),
              ),
              h(
                "div",
                { className: "list" },
                mode === "rooms"
                  ? rooms.map((room) =>
                      h(ListItem, {
                        key: room._id,
                        active: active?.id === room._id,
                        title: room.name,
                        subtitle: room.isPrivate ? "Private" : "Public",
                        initials: room.name,
                        onClick: () => openRoom(room),
                      }),
                    )
                  : h(
                      React.Fragment,
                      null,
                      conversations.map((conversation) => {
                        const other =
                          conversation.participants.find(
                            (item) => item._id !== user._id,
                          ) || conversation.participants[0];
                        return h(ListItem, {
                          key: conversation._id,
                          active: active?.id === conversation._id,
                          title: other.displayName || other.username,
                          subtitle: onlineUsers.has(other._id)
                            ? "Online"
                            : "Offline",
                          initials: other.displayName || other.username,
                          teal: true,
                          onClick: () => openConversation(conversation),
                        });
                      }),
                      users.map((item) =>
                        h(ListItem, {
                          key: item._id,
                          title: item.displayName || item.username,
                          subtitle: onlineUsers.has(item._id)
                            ? "Online"
                            : item.username,
                          initials: item.displayName || item.username,
                          teal: true,
                          onClick: () => startConversation(item),
                        }),
                      ),
                    ),
              ),
            ),
            h(
              "section",
              { className: "chat" },
              active
                ? h(
                    React.Fragment,
                    null,
                    h(
                      "div",
                      { className: "chat-head" },
                      h(
                        "div",
                        null,
                        h("strong", null, active.title),
                        h("div", { className: "muted" }, active.subtitle),
                      ),
                      h(
                        "button",
                        {
                          className: "ghost",
                          onClick: () =>
                            active.type === "room"
                              ? openRoom({
                                  _id: active.id,
                                  name: active.title,
                                  isPrivate: active.subtitle === "Private room",
                                })
                              : loadConversations(),
                        },
                        "Refresh",
                      ),
                    ),
                    h(
                      "div",
                      { className: "messages" },
                      loadingMessages
                        ? h("div", { className: "empty" }, "Loading")
                        : messages.map((message) =>
                            h(
                              "div",
                              {
                                key: message._id,
                                className: `bubble ${message.user?._id === user._id ? "me" : ""}`,
                              },
                              h(
                                "strong",
                                null,
                                message.user?.displayName ||
                                  message.user?.username ||
                                  "Unknown",
                              ),
                              h("p", null, message.text),
                              h(
                                "span",
                                { className: "time" },
                                new Date(message.createdAt).toLocaleString(),
                              ),
                            ),
                          ),
                    ),
                    h("div", { className: "typing" }, typing),
                    h(
                      "form",
                      { className: "composer", onSubmit: sendMessage },
                      h(
                        "div",
                        { className: "message-form" },
                        h("input", {
                          name: "message",
                          placeholder: "Message",
                          autoComplete: "off",
                          maxLength: 2000,
                          onInput: handleTyping,
                        }),
                        h(
                          "button",
                          { className: "primary", disabled: !connected },
                          "Send",
                        ),
                      ),
                    ),
                  )
                : h(
                    "div",
                    { className: "empty" },
                    "Select a room or direct conversation",
                  ),
            ),
          ),
          h(Toast, { toasts }),
        );
      }

      function ListItem(props) {
        return h(
          "button",
          {
            className: `item ${props.active ? "active" : ""}`,
            onClick: props.onClick,
          },
          h(
            "div",
            { className: `avatar ${props.teal ? "teal" : ""}` },
            (props.initials || "?").slice(0, 1).toUpperCase(),
          ),
          h(
            "div",
            { className: "item-main" },
            h("strong", null, props.title),
            h("span", { className: "muted" }, props.subtitle),
          ),
        );
      }

      function Toast({ toasts }) {
        return h(
          "div",
          { className: "toast" },
          toasts.map((item) =>
            h("div", { key: item.id, className: "toast-item" }, item.message),
          ),
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
